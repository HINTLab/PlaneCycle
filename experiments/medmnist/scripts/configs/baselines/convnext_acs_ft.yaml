# ACS baseline on DINOv3 ConvNeXt — Fine-Tuning.
# Native-3D ConvNeXt via ACSConv (downsamples D). See convnext_acs_lp.yaml.
# Needs `acsconv` + `timm`. final_pool_method=mean (ACS downsamples D).
seeds:
  - 42
#  - 123
#  - 1024
#  - 1337
#  - 2026
archs:
#  - dinov3_convnext_tiny
#  - dinov3_convnext_small
  - dinov3_convnext_base
#  - dinov3_convnext_large
datasets:
  - nodulemnist3d
  - organmnist3d
  - fracturemnist3d
  - adrenalmnist3d
  - vesselmnist3d
  - synapsemnist3d
block_types:
  - ACS
final_pool_methods:
  - mean
resolutions:
  - 64
train_args:
  training_method: FT
  num_epochs: 100
  batch_size: 32
  num_workers: 4
  upsample_scale: 1
  scheduler: WarmupCosineAnnealingLR
  warmup_epochs: 10
  max_lr: 5e-5
  weight_decay: 0.05
